<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Age Allowance</title>

    <!--Linking Css-->
    <link rel="stylesheet" href="css/style.css">

    <!-- Linking Tailwind CSS-->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200">

    <!--Header Section-->
    <header class="header p-4 bg-blue-900 text-white text-center">
        <h1 class="text-2xl font-bold"> Old Age Allowance</h1>
    </header>
    
    <!--Main Class-->
    <main class="container max-w-md mx-auto mt-8 bg-white p-6 rounded shadow">
       
        <!--Allowance Form-->
        <form id="allowanceForm">
            <input type="text" id="allowName" placeholder="Full Name">
            <input type="text" id="allowCitizen" placeholder="Citizenship Number">
            <input type="text" id="allowAge"placeholder="Age">
            <input type="text" id="bank" placeholder="Bank Account Number">

            <button type="submit"> Apply for Allowance </button>
            </form>

    </main>
</body>
</html>
