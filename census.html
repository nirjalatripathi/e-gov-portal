<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Population Census </title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/main.js" defer></script>

</head>
<body class="bg-gray-200">
    

    <!--Header section-->
    <a href="index.html" class="flex items-center space-x-3">
  
  <img src="https://i.pinimg.com/736x/d0/65/08/d06508db8968e0886d606c3383d0ffad.jpg"
       alt="Nepal Logo" class="h-8 w-auto">

  <h1 class="text-lg font-bold">
    National E-Government Portal
  </h1>
</a>
   <header class="header p-4 bg-blue-800 text-white text-center">   <h1 class="text-2xl font-bold"> Population Census Form </h1>
        <p class= "text-sm"> Digital Census Data Collection </p>
    </header>

    <main class="container max-w-md mx-auto mt-8 bg-white p-6 rounded-lg shadow">
     
        <!--Census Form-->
        <form id="censusForm" class="space-y-4">
            <input type="text" id="censusName" placeholder="Full Name" class="w-full p-2 border rounded" required>
            <input type="text" id="censusAddress" placeholder="Address" class="w-full p-2 border rounded" required>
            <input type="text" placeholder="citizenshipNumber" class="w-full  p-2 border rounded" required>
            <input type="number" id="familyCount" placeholder="Number of family members" class="w-full p-2 border rounded" required>
            <input type="text" placeholder="occupation" class="w-full border p-2 rounded text-gray-400">

            <!--Gender-->
            <select class="w-full border p-2 rounded text-gray-400" required>
                <option value="" > Select Gender</option>
                <option> Male</option>
                <option> Female </option>
                <option> Other </option>
            </select>

            <!--Age Group-->
            <select class="w-full border p-2 rounded text-gray-400" required>
                <option value=""> Select Age Group</option>
                <option> Below 18</option>
                <option> 18-25</option> 
                <option> 26-40</option>
                <option> 41-60</option>
                <option> Above 60</option>
            </select>

            <!--Living Abroad-->
            
            <select class="w-full p-2 border rounded text-gray-400">
                <option value=""> Anyone living abroad?</option>
                <option value="Yes"> Yes </option>
                <option value="No"> No </option>
            </select>

            <!--Submit Button-->
            <button type="submit" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700 transition"> Submit Census</button>
        </form>
    </main>
     <!--Footer-->
    <footer class="text-center text-gray-500 text-sm mt-10 mb-4">
        &copy 2026 Digital Government Initiative
    </footer>
</body>
</html>
